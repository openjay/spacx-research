name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run contract tests
        run: pytest --tb=short -q

      - name: Byte-compile plugin package
        run: python -m compileall -q plugin runtime scripts

      - name: Check dependency licenses are current (optional)
        continue-on-error: true
        run: |
          pip install pip-licenses
          pip-licenses --format=markdown --with-urls > /tmp/licenses-table.md
          tail -n +8 docs/DEPENDENCY_LICENSES.md > /tmp/committed-table.md
          diff -u /tmp/committed-table.md /tmp/licenses-table.md \
            || (echo "::warning::docs/DEPENDENCY_LICENSES.md drifted — run pip-licenses locally and commit." && exit 1)

      - name: Generate dependency license report (optional)
        continue-on-error: true
        run: |
          pip install pip-licenses
          {
            echo "# Dependency licenses"
            echo ""
            echo "> Auto-generated by CI. Regenerate locally — see CONTRIBUTING.md#dependency-licenses."
            echo ""
            pip-licenses --format=markdown --with-urls
          } > docs/DEPENDENCY_LICENSES.md

  supply-chain:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Export reproducible lock snapshot
        run: pip freeze > requirements-lock.txt

      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom.json --output-format json

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            requirements-lock.txt
            sbom.json
          retention-days: 90

  sec-feed-sync:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: SEC feed vs listing status
        env:
          SPACX_SEC_USER_AGENT: ${{ secrets.SPACX_SEC_USER_AGENT }}
        run: python scripts/check_sec_feed_sync.py --require-user-agent
