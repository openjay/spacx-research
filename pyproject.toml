[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spacx"
version = "0.1.0"
description = "SPACX intelligence plugin and research models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23.0",
    "PyYAML>=6.0.2",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plugin*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "plugin/tests"]
norecursedirs = [".venv", "runtime", "workstreams", ".git"]
addopts = "-q"
