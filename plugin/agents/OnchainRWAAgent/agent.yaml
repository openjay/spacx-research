# OnchainRWAAgent — RWA monitor + evidence hash (NO TRADING)

name: OnchainRWAAgent
version: "1.0.0"
role: |
  Monitor on-chain RWA and tokenized exposure surfaces linked to space/tech themes.
  Compute evidence hashes for artifact integrity; correlate with SEC evidence IDs.
  Strict research-only: no wallet signing, no swaps, no order routing.

inputs:
  - source: chain.indexed_events
    scope: [rwa_issuance, proof_of_reserve, token_metadata]
  - source: evidence_auditor.grade_register
  - source: internal.artifact_store
  - config:
      hash_algorithm: sha256
      anchor_to: evidence.grade_register

outputs:
  - artifact: onchain.rwa_watchlist
  - artifact: evidence.content_hash_manifest
  - event: onchain.rwa_anomaly
  - event: evidence.hash_mismatch
  - metric: onchain.rwa_count

forbidden_actions:
  - ANY_TRADING  # hard boundary — no exceptions
  - wallet_connect_or_sign
  - private_key_handling
  - promote_onchain_claim_to_grade_A_without_sec
  - execute_swaps_bridges_or_cex_orders
  - custody_or_staking_actions

schedule:
  cron: "*/1 * * * *"   # 1m — crypto tier floor
  cron_alt: "*/5 * * * *"  # 5m — default crypto tier per scheduler.yaml
  timezone: UTC
  hash_manifest_cron: "0 */1 * * *"  # hourly manifest rollup

human_gates:
  - gate: rwa_watchlist_inclusion
    required_before: daily_thesis_onchain_section
  - gate: hash_mismatch_investigation
    required_before: artifact_restore
